<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Catálogo de productos</title><style id="st">
:root{--bg:#fff;--fg:#000;--mu:#333;--cd:#fff;--bd:#1a9e55;--ac:#1a9e55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:16px}
h1{margin:0;font-size:22px}h2{margin:8px 0}h3{margin:8px 0 2px;font-size:15px}
button,.wa,.up{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--fg);padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
.pri,.wa{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}.wa{background:#1a9e55;border-color:#1a9e55}article .wa{margin-top:8px;padding:9px 6px;font-size:13px}.wa{display:block;text-align:center;margin-top:14px;padding:12px}
.del{color:#c0392b}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
nav{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px}.chip{white-space:nowrap;border-radius:99px}.chip.on{background:var(--fg);color:var(--bg)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:8px 16px 32px}
article{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:8px;cursor:pointer}
.ph{position:relative;aspect-ratio:1;background:var(--bd);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mu)}
.ph img{width:100%;height:100%;object-fit:cover}.ph em{position:absolute;top:6px;left:6px;font-style:normal;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac);color:#fff}.ph em.u{background:#b9770e}
.pr{margin:0;font-weight:700}small{color:var(--mu)}.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px 0}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}
.box{background:var(--cd);width:min(560px,100%);max-height:92%;overflow:auto;border-radius:16px;padding:16px;position:relative}
.x{position:absolute;top:8px;right:8px;padding:4px 10px;z-index:2}
.big{aspect-ratio:1;background:var(--bd);border-radius:12px;overflow:hidden}.big img{width:100%;height:100%;object-fit:contain}
.th{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.th img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer}.th img.on{border-color:var(--ac)}
.th span{position:relative}.th b{position:absolute;top:-4px;right:-4px;background:#c0392b;color:#fff;border-radius:99px;width:20px;height:20px;text-align:center;font-size:12px;line-height:20px;cursor:pointer}
label{display:block;margin-top:10px;font-size:13px;color:var(--mu)}input,select,textarea{width:100%;font:inherit;padding:8px;margin-top:4px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.up{margin-top:6px}.ct{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}.ct input{margin:0}.prv{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-top:6px;white-space:pre-wrap;font-size:13px}:root{color-scheme:light}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:#000}
header{background:linear-gradient(135deg,#0f6b39,#1a9e55);color:#fff;padding:18px 16px;border-bottom:3px solid #0f6b39}
header h1{color:#fff;font-size:26px;letter-spacing:.3px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #fff;flex:none}.logo.sq{border-radius:10px}
.lg{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}.lg .logo{border-color:var(--ac)}
nav{background:#1a9e55;padding:10px 16px;border-top:1px solid rgba(255,255,255,.4)}
.chip{background:transparent;color:#fff;border:1px solid #fff}.chip.on{background:#0f6b39;border-color:#0f6b39;color:#fff}
main{padding-top:20px}
article{border:1.5px solid var(--ac);box-shadow:0 2px 10px rgba(26,158,85,.18);transition:transform .15s}article:hover{transform:translateY(-2px)}
.ph{background:#fff;border:1px solid var(--ac)}.ph em.u{background:#0f6b39}
.pr{color:#000;font-size:16px}
.box{border:2px solid var(--ac)}.big{background:#fff;border:1px solid var(--ac)}
footer{background:#0f6b39;color:#fff;text-align:center;padding:14px 16px;font-size:13px}footer a{color:#fff;text-decoration:underline}
.lkb{border:2px solid var(--ac);border-radius:12px;padding:10px;margin-top:10px;background:#f1faf5}.lkb b{font-family:Georgia,serif}.lkb small{display:block;margin-top:6px}
.bt{min-width:0}.sub{margin:2px 0 0;font-size:12.5px;color:rgba(255,255,255,.92);letter-spacing:.2px}
header .bar{flex-wrap:nowrap;width:100%;gap:6px;margin:0}header .bar button{flex:1;padding:6px 4px;font-size:12.5px;white-space:nowrap}
:root{padding-bottom:0}
#root{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
main{flex:1;align-content:start;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:1100px;margin:0 auto}
footer{margin-top:auto;padding:5px 10px calc(5px + env(safe-area-inset-bottom,0px));font-size:11px}
@media(max-width:700px){main{grid-template-columns:repeat(2,1fr);gap:8px;padding:12px 10px 16px}article{padding:6px}article h3{font-size:13px;margin:6px 0 2px}.pr{font-size:14px}article small{font-size:11px}article .wa{font-size:11px;padding:7px 4px}}
nav{background:#0a4d2a;padding:5px 12px;gap:6px;border-top:0}
.chip{background:#1a9e55;color:#fff;border:1px solid #1a9e55;padding:3px 10px;font-size:12px;line-height:1.4}
.chip.on{background:#1a9e55;border-color:#fff;box-shadow:0 0 0 1px #fff;font-weight:700}
main{max-width:720px;gap:10px;padding:14px 12px 20px}
article{padding:6px;border-radius:10px}
article h3{font-size:13px;margin:6px 0 2px}.pr{font-size:14px}article small{font-size:11px}
article .wa{font-size:11px;padding:6px 4px}
.ph em{font-size:10px;padding:1px 6px;top:4px;left:4px}
@media(max-width:700px){main{grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 8px 14px;max-width:none}article{padding:4px;border-radius:8px}article h3{font-size:11px}.pr{font-size:12px}article small{font-size:10px}article .wa{font-size:9.5px;padding:5px 2px}article .wa svg{display:none}.ph em{font-size:9px}}
header{padding:13px 14px;gap:8px;border-bottom-width:2px}
header h1{font-size:19.5px}
.logo{width:40px;height:40px}.brand{gap:9px}
.sub{font-size:10px;margin-top:1px}
header .bar button{padding:4.5px 3px;font-size:11px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;z-index:10}#toast.show{opacity:1}

function login(){return `<div class="box"><button class="x" onclick="closeV()">✕</button><h2>Acceso de administrador</h2><label>Usuario<input id="lu" autocomplete="username"></label><label>Clave<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"></label><div class="bar"><button class="pri" onclick="doLogin()">Entrar</button></div></div>`}
async function doLogin(){if(fails>=5)return toast('Demasiados intentos; recarga la página');
 const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value,A=D.auth||AUTH0;
 try{const hu=await H(u,A.s+'u'),hp=await H(p,A.s+'p');
  if(hu==A.u&&hp==A.p){lg=true;try{sessionStorage.setItem('adm','1')}catch(e){}V=null;gate();if(!own)toast('Para guardar cambios abre el enlace con tu cuenta de Claude')}
  else{fails++;toast('Usuario o clave incorrectos')}
 }catch(e){toast('No se pudo verificar')}}
async function saveCfg(){
 if(!V.d.msg.trim())V.d.msg=DEF;
 const nu=$('#au').value.trim().toLowerCase(),np=$('#an').value,cp=$('#ac').value;
 if(nu||np){const A=D.auth||AUTH0;
  if(np&&np.length<8)return toast('La clave nueva debe tener al menos 8 caracteres');
  if(nu&&nu.length<4)return toast('El usuario debe tener al menos 4 caracteres');
  let ok=false;try{ok=(await H(cp,A.s+'p'))==A.p}catch(e){}
  if(!ok)return toast('La clave actual no es correcta');
  D.auth={s:A.s,u:nu?await H(nu,A.s+'u'):A.u,p:np?await H(np,A.s+'p'):A.p};
 }
 Object.assign(D,V.d);V=null;render();save()}
function addLogo(fs){const f=fs[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);V.d.logo=c.toDataURL('image/png');render()};im.src=r.result};r.readAsDataURL(f)}
const LINK0=location.protocol.indexOf('http')==0?location.href.split('#')[0].split('?')[0]:'';
function lkm(v){return v&&v.trim()?'Este es el enlace que enviarás a tus clientes. Pulsa Guardar para dejarlo registrado.':'Todavía no hay enlace. Sube el archivo index.html a tu hosting (Netlify, GitHub Pages u otro), copia la dirección que te den, pégala en este recuadro y pulsa Guardar. Luego podrás copiarla aquí cuando quieras.'}
function lkh(){const e=$('#lkt');if(e)e.textContent=lkm(V.d.link)}
async function cp(){const e=$('#lk'),t=e.value;if(!t.trim())return toast('Primero pega tu enlace en el recuadro');try{await navigator.clipboard.writeText(t);return toast('Enlace copiado')}catch(x){}
 e.select();e.setSelectionRange(0,999);let ok=false;try{ok=document.execCommand('copy')}catch(x){}toast(ok?'Enlace copiado':'Selecciona el enlace y cópialo')}
const DEF='Hola, soy {nombre}. Deseo el producto solicitado: {producto}, {precio}. Gracias por solicitarlo.';
const SMP={name:'Nombre del producto',price:25,cat:'Categoría',st:'n',desc:'Descripción del producto'};
function fmt(i,t,n){const tp=t||D.msg||DEF;let r=tp.replace(/\{(producto|precio|categoria|estado|descripcion|nombre)\}/g,(m,k)=>({producto:i.name,precio:Number(i.price)+' '+D.cur,categoria:i.cat,estado:stl(i.st),descripcion:i.desc||'',nombre:n||''}[k]));if(n&&!tp.includes('{nombre}'))r+='\n\nMi nombre: '+n;return r}
function prv(){const e=$('#prv');if(e)e.textContent=fmt(SMP,V.d.msg,'María')}
function gn(){try{return localStorage.getItem('cn')||''}catch(e){return ''}}
function bhref(i){return 'https://wa.me/'+D.phone.replace(/\D/g,'')+'?text='+encodeURIComponent(fmt(i,null,(V.n||'').trim()))}
function upd(){const i=D.items.find(x=>x.id==V.id),a=$('#go');if(a&&i)a.href=bhref(i)}
function chk(){const n=(V.n||'').trim();if(!n){toast('Escribe tu nombre');return false}try{localStorage.setItem('cn',n)}catch(e){}return true}
function buy(){const i=D.items.find(x=>x.id==V.id);if(!i)return'';return `<div class="box"><button class="x" onclick="closeV()">✕</button><h2>${esc(i.name)}</h2><p class="pr">${money(i.price)}</p><label>Tu nombre<input placeholder="Escribe tu nombre" value="${esc(V.n||'')}" oninput="V.n=this.value;upd()"></label><a id="go" class="wa" target="_blank" rel="noopener" onclick="return chk()" href="${bhref(i)}">${WAI}Continuar a WhatsApp</a><small style="display:block;margin-top:8px">Se abrirá WhatsApp con el mensaje listo para enviar al vendedor.</small></div>`}
const WAI='<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="vertical-align:-3px;margin-right:6px"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2z"/></svg>';
function waBtn(i){const ph=D.phone.replace(/\D/g,'');if(!ph)return admin?'<small style="display:block;margin-top:8px">Configura tu WhatsApp en Ajustes</small>':'';
 const msg=`Hola, me interesa este producto:\n*${i.name}*\nCategoría: ${i.cat}\nEstado: ${stl(i.st)}\nPrecio: ${Number(i.price)} ${D.cur}\n${i.desc}\n\n¿Está disponible?`;
 return `<a class="wa" href="#" onclick="event.stopPropagation();event.preventDefault();openV({t:'buy',id:'${i.id}',n:gn()})">${WAI}Comunicarse con el vendedor</a>`}
function card(i){return `<article onclick="openV({t:'d',id:'${i.id}',k:0})"><div class="ph">${i.photos[0]?`<img src="${i.photos[0]}">`:'<span>Sin foto</span>'}<em class="${i.st}">${stl(i.st)}</em></div><h3>${esc(i.name)}</h3><p class="pr">${money(i.price)}</p><small>${esc(i.cat)}</small>${waBtn(i)}</article>`}
function modal(){return V.t=='dl'?dlm():V.t=='login'?login():V.t=='buy'?buy():V.t=='d'?det():V.t=='e'?frm():V.t=='cfg'?cfg():cts()}
function det(){
 const i=D.items.find(x=>x.id==V.id);if(!i)return'';
 const msg=`Hola, me interesa este producto:\n*${i.name}*\nCategoría: ${i.cat}\nEstado: ${stl(i.st)}\nPrecio: ${Number(i.price)} ${D.cur}\n${i.desc}\n\n¿Está disponible?`;
 const ph=D.phone.replace(/\D/g,'');
 return `<div class="box"><button class="x" onclick="closeV()">✕</button><div class="big">${i.photos.length?`<img src="${i.photos[V.k]}">`:''}</div>
 <div class="th">${i.photos.map((p,k)=>`<img src="${p}" class="${k==V.k?'on':''}" onclick="V.k=${k};render()">`).join('')}</div>
 <h2>${esc(i.name)}</h2><p class="pr" style="font-size:20px">${money(i.price)} · ${stl(i.st)}</p><small>${esc(i.cat)}</small>
 <p style="white-space:pre-wrap">${esc(i.desc)}</p>
 ${waBtn(i)}
 ${admin?`<div class="bar"><button onclick="editP('${i.id}')">Editar producto</button></div>`:''}</div>`}
function editP(id){const i=D.items.find(x=>x.id==id);openV({t:'e',d:i?JSON.parse(JSON.stringify(i)):{id:'',name:'',cat:D.cats[0],price:'',st:'n',desc:'',photos:[]}})}
function frm(){const d=V.d;return `<div class="box"><button class="x" onclick="closeV()">✕</button><h2>${d.id?'Editar':'Nuevo'} producto</h2>
 <label>Nombre<input value="${esc(d.name)}" oninput="V.d.name=this.value"></label>
 <label>Categoría<select onchange="V.d.cat=this.value">${D.cats.map(c=>`<option ${c==d.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
 <div class="row"><label>Precio unitario (${esc(D.cur)})<input type="number" min="0" step="any" value="${esc(d.price)}" oninput="V.d.price=this.value"></label>
 <label>Estado<select onchange="V.d.st=this.value"><option value="n" ${d.st=='n'?'selected':''}>Nuevo</option><option value="u" ${d.st=='u'?'selected':''}>Usado</option></select></label></div>
 <label>Descripción<textarea rows="4" oninput="V.d.desc=this.value">${esc(d.desc)}</textarea></label>
 <div class="th">${d.photos.map((p,k)=>`<span><img src="${p}"><b onclick="V.d.photos.splice(${k},1);render()">✕</b></span>`).join('')}</div>
 ${d.photos.length<8?`<label class="up">+ Agregar fotos (${d.photos.length}/8)<input type="file" accept="image/*" multiple hidden onchange="addPh(this.files)"></label>`:'<small>Máximo 8 fotos</small>'}
 <div class="bar"><button class="pri" onclick="saveP()">Guardar</button>${d.id?`<button class="del" onclick="delP()">${V.cf?'¿Seguro? Toca otra vez':'Eliminar'}</button>`:''}</div></div>`}
function shrink(f){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(f)})}
async function addPh(fs){for(const f of [...fs].slice(0,8-V.d.photos.length)){try{V.d.photos.push(await shrink(f))}catch(e){}}render()}
function saveP(){const d=V.d;if(!d.name.trim())return toast('Falta el nombre');if(d.price===''||isNaN(d.price))return toast('Falta el precio');
 d.price=Number(d.price);if(d.id){D.items[D.items.findIndex(x=>x.id==d.id)]=d}else{d.id='p'+Date.now();D.items.unshift(d)}V=null;render();save()}
function delP(){if(!V.cf){V.cf=1;return render()}D.items=D.items.filter(x=>x.id!=V.d.id);V=null;render();save()}
function cfg(){const d=V.d;return `<div class="box"><button class="x" onclick="closeV()">✕</button><h2>Ajustes</h2>
 <div class="lkb"><b>Enlace del catálogo para compartir en redes sociales</b><div class="lg"><input id="lk" style="flex:1;min-width:0" placeholder="Pega aquí el enlace de tu catálogo" value="${esc(d.link)}" oninput="V.d.link=this.value;lkh()"><button class="pri" onclick="cp()">Copiar</button></div><small id="lkt">${lkm(d.link)}</small></div>
 <label>Logo de la tienda</label><div class="lg">${d.logo?`<img class="logo${d.shp=='s'?' sq':''}" src="${d.logo}">`:'<small>Sin logo</small>'}<label class="up">Subir logo<input type="file" accept="image/*" hidden onchange="addLogo(this.files)"></label>${d.logo?`<button onclick="V.d.logo='';render()">Quitar</button>`:''}</div>
 <label>Forma del logo<select onchange="V.d.shp=this.value;render()"><option value="c" ${d.shp!='s'?'selected':''}>Círculo</option><option value="s" ${d.shp=='s'?'selected':''}>Cuadrado</option></select></label>
 <label>Nombre de la tienda<input value="${esc(d.name)}" oninput="V.d.name=this.value"></label>
 <label>Subtítulo (a qué se dedica tu tienda)<input maxlength="80" placeholder="Ej. Juguetes y artículos para el hogar" value="${esc(d.sub)}" oninput="V.d.sub=this.value"></label>
 <label>Tu WhatsApp (con código de país, solo números)<input inputmode="tel" placeholder="584121234567" value="${esc(d.phone)}" oninput="V.d.phone=this.value"></label>
 <label>Divisa (ej. USD, EUR)<input value="${esc(d.cur)}" oninput="V.d.cur=this.value"></label>
 <label>Mensaje de WhatsApp que se envía al vendedor<textarea rows="4" oninput="V.d.msg=this.value;prv()">${esc(d.msg)}</textarea></label>
 <small>Puedes usar: {producto} {precio} {categoria} {estado} {descripcion} {nombre}</small>
 <div class="prv" id="prv">${esc(fmt(SMP,d.msg,'María'))}</div>
 <div class="bar"><button onclick="V.d.msg=DEF;render()">Restaurar mensaje</button></div>
 <h3 style="margin-top:18px">Seguridad del administrador</h3>
 <small>Deja vacío lo que no quieras cambiar. Para cambiar usuario o clave debes escribir la clave actual.</small>
 <label>Usuario nuevo<input id="au" autocomplete="off"></label>
 <label>Clave actual<input id="ac" type="password" autocomplete="off"></label>
 <label>Clave nueva (mínimo 8 caracteres)<input id="an" type="password" autocomplete="new-password"></label>
 <div class="bar"><button class="pri" onclick="saveCfg()">Guardar</button></div></div>`}
function cts(){return `<div class="box"><button class="x" onclick="closeV()">✕</button><h2>Categorías</h2>
 ${V.c.map((c,k)=>`<div class="ct"><input value="${esc(c.n)}" oninput="V.c[${k}].n=this.value"><button class="del" onclick="delC(${k})">✕</button></div>`).join('')}
 <label>Nueva categoría<input id="nc" placeholder="Ej. Electrónica" onkeydown="if(event.key=='Enter')addC()"></label>
 <div class="bar"><button onclick="addC()">Agregar</button><button class="pri" onclick="saveC()">Guardar</button></div></div>`}
function addC(){const v=$('#nc').value.trim();if(!v)return;if(V.c.some(c=>c.n.trim().toLowerCase()==v.toLowerCase()))return toast('Esa categoría ya existe');V.c.push({o:null,n:v});render();setTimeout(()=>{const e=$('#nc');if(e)e.focus()})}
function delC(k){const c=V.c[k];if(c.o&&D.items.some(i=>i.cat==c.o))return toast('Hay productos en esa categoría; cámbialos primero');if(V.c.length<2)return toast('Debe quedar una categoría');V.c.splice(k,1);render()}
function saveC(){const e=$('#nc'),v=e?e.value.trim():'';if(v&&!V.c.some(c=>c.n.trim().toLowerCase()==v.toLowerCase()))V.c.push({o:null,n:v});
 const names=V.c.map(c=>c.n.trim());if(names.some(n=>!n))return toast('Hay una categoría vacía');if(new Set(names.map(n=>n.toLowerCase())).size<names.length)return toast('Hay categorías repetidas');
 const mp={};V.c.forEach((c,k)=>{if(c.o)mp[c.o]=names[k]});D.items.forEach(i=>{if(mp[i.cat])i.cat=mp[i.cat]});
 D.cats=names;if(!D.cats.includes(filter))filter='Todas';V=null;render();save()}
function build(){return '<!doctype html>\n<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Catálogo de productos</title><style id="st">'+$('#st').textContent+'</style></head><body><div id="root"></div><script id="data" type="application/json">'+JSON.stringify(D).replace(/</g,'\\u003c')+'<\/script><script id="app">'+$('#app').textContent+'<\/script></body></html>'}
function idbGet(){return new Promise(ok=>{try{const r=indexedDB.open('cat',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onerror=()=>ok(null);r.onsuccess=()=>{const g=r.result.transaction('k').objectStore('k').get('d');g.onsuccess=()=>ok(g.result||null);g.onerror=()=>ok(null)}}catch(e){ok(null)}})}
function idbSet(v){return new Promise(ok=>{try{const r=indexedDB.open('cat',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onerror=()=>ok(false);r.onsuccess=()=>{const t=r.result.transaction('k','readwrite');t.objectStore('k').put(v,'d');t.oncomplete=()=>ok(true);t.onerror=()=>ok(false)}}catch(e){ok(false)}})}
async function save(){D.v=Date.now();const ok=await idbSet(JSON.stringify(D));toast(ok?'Guardado en este dispositivo. Pulsa Descargar para actualizar lo que ven tus clientes':'No se pudo guardar en este dispositivo')}
function dlf(){try{const b=new Blob([build()],{type:'text/html'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='index.html';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000)}catch(e){toast('Este navegador bloqueó la descarga')}}
function pub(){dlf();openV({t:'dl'})}
async function shr(){const f=new File([build()],'index.html',{type:'text/html'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'index.html'});return}}catch(e){if(e&&e.name=='AbortError')return}toast('Aquí no se puede compartir el archivo')}
async function cpc(){try{await navigator.clipboard.writeText(build());toast('Código copiado. Pégalo en un archivo de texto llamado index.html')}catch(e){toast('No se pudo copiar desde aquí')}}
function dlm(){return `<div class="box"><button class="x" onclick="closeV()">✕</button><h2>Descargar catálogo</h2><p>Se intentó descargar el archivo <b>index.html</b>. Si ya aparece en tus descargas, cierra esta ventana y súbelo a tu hosting.</p><p>Si no se descargó (pasa cuando la página se abre dentro de otra aplicación o vista previa), prueba:</p><div class="bar"><button class="pri" onclick="dlf()">Descargar de nuevo</button><button onclick="shr()">Guardar o compartir archivo</button><button onclick="cpc()">Copiar el código</button></div><small style="display:block;margin-top:8px">Si ninguna funciona, abre el catálogo directamente en tu navegador, fuera de la vista previa, y repite desde ahí.</small></div>`}
render();
(async()=>{try{const l=JSON.parse(await idbGet()||'null');if(l&&(l.v||0)>(D.v||0)){Object.keys(D).forEach(x=>delete D[x]);Object.assign(D,l)}}catch(e){}own=true;gate()})();
</script></body></html>
